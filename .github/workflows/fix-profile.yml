name: Fix profile integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fixed profile loader
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="profile-fix.js"></script>'
          if marker not in text:
              text = text.replace('<script src="profile.js"></script>', '<script src="profile.js"></script>\n    <script src="profile-fix.js"></script>')
              p.write_text(text, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix profile page routing and loading"
          git push
