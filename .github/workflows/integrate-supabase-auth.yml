name: Integrate Supabase Auth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Supabase scripts are loaded
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          scripts = [
              '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>',
              '<script src="supabase-auth.js"></script>',
              '<script src="cloud-sync.js"></script>'
          ]
          missing = [s for s in scripts if s not in text]
          if missing:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in index.html')
              block = '\n'.join('  ' + s for s in missing)
              text = text.replace(marker, block + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
              print('Injected missing Supabase scripts:', len(missing))
          else:
              print('All Supabase scripts are already loaded.')

      - name: Validate Supabase integration
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
              'src="supabase-auth.js"',
              'src="cloud-sync.js"'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing required integration: ' + ', '.join(missing))
          print('Supabase authentication and cloud synchronization validated.')

      - name: Commit integration if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: enable Supabase auth and cloud scan sync [skip ci]"
            git push
          fi
